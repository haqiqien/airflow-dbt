procurement_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: postgres
      port: 5432
      dbname: procurement_dw
      user: admin
      password: admin
      schema: staging       # staging models akan di-deploy ke skema ini
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10

    prod:
      type: postgres
      host: "{{ env_var('DBT_PROD_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PROD_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_PROD_DBNAME', 'procurement_dw') }}"
      user: "{{ env_var('DBT_PROD_USER', 'admin') }}"
      password: "{{ env_var('DBT_PROD_PASSWORD', 'admin') }}"
      schema: staging
      threads: 8
      keepalives_idle: 0
