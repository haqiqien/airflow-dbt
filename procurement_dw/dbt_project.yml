name: 'procurement_dw'
version: '1.0.0'
config-version: 2

profile: 'procurement_dw'

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# KONFIGURASI MODEL PER LAYER
# Dengan macro generate_schema_name, +schema menentukan nama skema akhir secara
# eksplisit — bukan prefix. Contoh: +schema: marts  →  skema "marts".
# =============================================================================
models:
  procurement_dw:

    # ── Staging Layer ─────────────────────────────────────────────────────────
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging", "raw"]

    # ── Intermediate Layer ────────────────────────────────────────────────────
    # Gabungan / transformasi pre-mart; view agar tidak duplikasi storage.
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]

    # ── Marts Layer ───────────────────────────────────────────────────────────
    # Dimensi & fakta untuk konsumsi end-user (BI, analitik).
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
